[build]
  command = "npm run ingest:media && npm run enrich:fandom-full && npm run audit:enrichment && npm run publish:enrichment-preview && npm run ensure:fandom-canonical && npm run cache:media && vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[images]
  remote_images = [
    'https://images\\.amcnetworks\\.com/.*',
    'https://images\\.cds\\.amcn\\.com/.*',
    'https://dimages\\.cds\\.amcn\\.com/.*'
  ]

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
