name = "walking-dead-atlas-media"
main = "src/index.ts"
# Workers Caching (the [cache] block below) needs a compatibility date on or after 2026-07-06.
compatibility_date = "2026-09-23"
workers_dev = true

# Workers Caching: Cloudflare caches this Worker's own responses (honouring the Cache-Control we return)
# and serves hits without invoking the Worker. Works on *.workers.dev, unlike the classic Cache API.
[cache]
enabled = true

[observability]
enabled = true
head_sampling_rate = 1
