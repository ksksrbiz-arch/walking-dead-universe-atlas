name: Refresh Fandom Atlas Enrichment

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: fandom-enrichment
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Refresh Fandom enrichment
        env:
          ENRICHMENT_LIMIT: "5000"
          FANDOM_REQUEST_DELAY_MS: "150"
        run: |
          npm run enrich:fandom-atlas
          npm run enrich:fandom-pages
          npm run reconcile:fandom
          npm run publish:fandom-canonical
          npm run promote:fandom-media
          npm run audit:enrichment
          npm run publish:enrichment-preview

      - name: Remove transient enrichment payloads
        run: |
          rm -f data/enrichment/fandom-atlas-candidates.json
          rm -f data/enrichment/fandom-page-enrichment.json
          rm -f data/enrichment/fandom-page-enrichment-summary.json

      - name: Commit refreshed enrichment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/enrichment data/media.json
          if git diff --cached --quiet; then
            echo "No enrichment changes to commit."
            exit 0
          fi
          git commit -m "Refresh Fandom Atlas enrichment"
          git push
